<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
  <title>Login - Photo Booth</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <header class="header">
    <a href="index.html" class="logo">Photo Booth</a>
    <nav class="header-nav" aria-label="Primary Navigation">
      <ul class="header-nav-ul">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="login.html" aria-current="page">Login</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="login-heading">
      <h1 id="login-heading">Welcome Back</h1>
      <p class="auth-subtitle">Log in to access the photo booth and your cloud gallery.</p>

      <form class="auth-form" id="login-form">
        <fieldset class="auth-fieldset">
          <legend class="sr-only">Account Credentials</legend>

          <p class="form-group">
            <label for="login-email">Email Address</label>
            <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
          </p>

          <p class="form-group">
            <label for="login-password">Password</label>
            <input type="password" id="login-password" name="password" placeholder="Enter your password" required>
          </p>
        </fieldset>

        <button type="submit" class="cta-btn auth-submit">Login</button>
      </form>

      <p class="auth-switch">
        Don't have an account yet? <a href="register.html">Register here</a>
      </p>
    </section>
  </main>

  <script type="module" src="javascript/auth/auth.js"></script>
</body>
</html>
